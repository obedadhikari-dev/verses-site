<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Bible Verses</title>
  </head>
  <body>
    <main>
      <section class="name-section">
        <div class="content-name">
          <span class="user-greeting" style="display: inline-block">
            Good morning, Friend! </span
          ><br />
          <p class="user-feeling">How are you feeling?</p>
          <label for="input-name" class="user-label">Enter your name</label>
          <br />
          <input type="text" id="input-name" />
          <button class="display-verse">get verse</button>
        </div>
      </section>
      <section class="verse-section">
        <p class="content-verse">Get your verse</p>
      </section>
      <script src="script.js"></script>
    </main>
  </body>
</html>
